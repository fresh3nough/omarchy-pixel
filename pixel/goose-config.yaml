OPENROUTER_HOST: https://openrouter.ai
providers:
  openrouter:
    enabled: true
    model: x-ai/grok-4.5
    configured: true
GOOSE_MODE: auto
GOOSE_TELEMETRY_ENABLED: false
GOOSE_THINKING_EFFORT: medium
active_provider: openrouter
extensions:
  developer:
    enabled: true
    type: platform
    name: developer
    display_name: Developer
    bundled: true
  todo:
    enabled: true
    type: platform
    name: todo
    display_name: Todo
    bundled: true
